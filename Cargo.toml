[package]
name = "patroclus"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Scoped, time-limited authorization infrastructure for AI agents"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
jsonwebtoken = "9"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
async-trait = "0.1"
parking_lot = "0.12"
base64 = "0.22"
rand = "0.8"
rsa = { version = "0.9", features = ["sha2", "pem"] }
serde_yaml = "0.9"
aes-gcm = "0.10"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
