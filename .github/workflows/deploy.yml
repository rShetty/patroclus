name: Deploy Patroclus

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patroclus-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Scan tracked files for credentials
        shell: bash
        run: |
          if git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' -- ':!.github/workflows/deploy.yml' ':!README.md'; then
            exit 1
          fi

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install security tooling
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Cargo deny
        run: cargo deny check advisories bans licenses sources
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: 1

  deploy:
    needs: [verify, security]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: |
            set -euo pipefail

            if [ ! -d /opt/patroclus/.git ]; then
              rm -rf /opt/patroclus
              git clone https://github.com/rShetty/patroclus.git /opt/patroclus
            fi

            cd /opt/patroclus
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            # Ensure config and env directories
            mkdir -p /etc/patroclus/keys
            if [ ! -f /etc/patroclus/patroclus.env ]; then
              echo "RUST_LOG=info" > /etc/patroclus/patroclus.env
            fi
            chmod 600 /etc/patroclus/patroclus.env

            # Copy config
            cp config/patroclus.toml /etc/patroclus/patroclus.toml

            # Build
            source "$HOME/.cargo/env"
            cargo build --release

            # Install binary
            install -m 755 target/release/patroclus /usr/local/bin/patroclus

            # Ensure user and data directory
            id patroclus >/dev/null 2>&1 || useradd --system --home-dir /var/lib/patroclus --create-home --shell /usr/sbin/nologin patroclus
            mkdir -p /var/lib/patroclus
            chown patroclus:patroclus /var/lib/patroclus

            # Generate RSA keypair for JWT signing if not present
            if [ ! -f /etc/patroclus/keys/private.pem ]; then
              /usr/local/bin/patroclus generate-keys -o /etc/patroclus/keys
            fi

            # Generate vault encryption key if not present
            if [ ! -f /etc/patroclus/keys/vault.key ]; then
              openssl rand -hex 32 > /etc/patroclus/keys/vault.key
            fi

            # Set key permissions
            chown -R patroclus:patroclus /etc/patroclus/keys
            chmod 600 /etc/patroclus/keys/private.pem /etc/patroclus/keys/vault.key
            chmod 644 /etc/patroclus/keys/public.pem

            # Install systemd unit
            cp deploy/patroclus.service /etc/systemd/system/patroclus.service
            systemctl daemon-reload
            systemctl enable patroclus
            systemctl restart patroclus

            # Health check with retries
            sleep 5
            for i in 1 2 3 4 5; do
              if curl -sf http://127.0.0.1:8484/health; then
                echo ""
                echo "DEPLOY SUCCESS: patroclus is healthy"
                exit 0
              fi
              echo "Health check attempt $i failed, waiting..."
              sleep 5
            done

            echo "ERROR: Health check failed"
            journalctl -u patroclus -n 30 --no-pager
            exit 1

      - name: Retry deploy (1)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: |
            set -euo pipefail
            source "$HOME/.cargo/env"
            cd /opt/patroclus
            git fetch origin main
            git reset --hard origin/main
            cargo build --release
            install -m 755 target/release/patroclus /usr/local/bin/patroclus
            cp config/patroclus.toml /etc/patroclus/patroclus.toml
            cp deploy/patroclus.service /etc/systemd/system/patroclus.service
            systemctl daemon-reload
            systemctl restart patroclus
            sleep 5
            curl -sf http://127.0.0.1:8484/health && echo "DEPLOY SUCCESS (retry 1)" || (journalctl -u patroclus -n 20 --no-pager && exit 1)

      - name: Retry deploy (2)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: |
            set -euo pipefail
            source "$HOME/.cargo/env"
            cd /opt/patroclus
            systemctl restart patroclus
            sleep 5
            curl -sf http://127.0.0.1:8484/health && echo "DEPLOY SUCCESS (retry 2)" || (journalctl -u patroclus -n 20 --no-pager && exit 1)
