[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patroclus-sdk"
version = "0.1.0"
description = "Python SDK for Patroclus — scoped, time-limited authorization infrastructure for AI agents"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["."]
