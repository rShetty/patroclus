# Patroclus production reverse proxy — PRODUCTION CUTOVER
#
# Per docs/MIGRATION_GOALS.md (Governance Hub) production cutover checklist:
# "Keep dashboard at / internal-only; all operator workflows are now
# Hub-owned."
#
# The dashboard/operator UI is limited to the Tailscale tailnet
# (100.64.0.0/10). The API (/v1) stays reachable for service-to-service
# calls and is admin-token enforced at the application. The Hub proxies
# Patroclus server-side over 127.0.0.1:8484.

server {
    listen 80;
    server_name patroclus.rajeev.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name patroclus.rajeev.me;

    ssl_certificate     /etc/letsencrypt/live/patroclus.rajeev.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/patroclus.rajeev.me/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    # Health probe stays reachable for monitoring.
    location = /health {
        proxy_pass http://127.0.0.1:8484;
    }

    # API — token-enforced at the application.
    location /v1/ {
        proxy_pass http://127.0.0.1:8484;
    }

    # Dashboard and all operator UI — tailnet only.
    location / {
        allow 100.64.0.0/10;
        deny all;
        proxy_pass http://127.0.0.1:8484;
    }
}
